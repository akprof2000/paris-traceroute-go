name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/paris-traceroute
      - name: Test the release pruning script
        if: runner.os == 'Linux'
        run: bash scripts/prune-releases_test.sh
  lab:
    # Autotest on a namespace network with an ECMP load balancer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o paris-traceroute ./cmd/paris-traceroute
      - run: sudo PT=./paris-traceroute bash test/lab/ecmp.sh
      - name: Integration tests as root
        run: |
          go test -c -o probe.test ./internal/probe
          go test -c -o cmd.test ./cmd/paris-traceroute
          sudo ./probe.test -test.v
          sudo PT_BIN=$PWD/paris-traceroute ./cmd.test -test.v
