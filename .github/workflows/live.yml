name: Live trace

# Manual end-to-end check on real networks from GitHub-hosted runners.
on:
  workflow_dispatch:
    inputs:
      host:
        description: Host to trace
        default: 1.1.1.1

jobs:
  trace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o pt${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/paris-traceroute
      - name: Trace (Linux)
        if: runner.os == 'Linux'
        run: |
          for p in udp icmp tcp; do sudo ./pt -n -w 1 -m 20 -P $p "${{ inputs.host }}" || true; done
          sudo ./pt -n -w 1 -m 20 -a mda -P icmp "${{ inputs.host }}" || true
      - name: Trace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-NetFirewallRule -DisplayName "pt ICMPv4" -Direction Inbound -Protocol ICMPv4 -IcmpType 11,3 -Action Allow | Out-Null
          foreach ($p in 'udp', 'icmp') { .\pt.exe -n -w 1 -m 20 -P $p "${{ inputs.host }}" }
          .\pt.exe -n -w 1 -m 20 -a mda -P icmp "${{ inputs.host }}"
          tracert -d -h 20 -w 1000 "${{ inputs.host }}"
